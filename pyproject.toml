[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "uz801_sms"
version = "1.0.0"
description = "Send, receive, and monitor SMS on the UZ801 4G LTE USB dongle from Python"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Godwhitelight"}]
keywords = ["sms", "uz801", "gsm", "lte", "4g", "modem", "dongle", "qualcomm", "msm8916"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Telephony",
]

[project.urls]
"Homepage" = "https://github.com/Godwhitelight/uz801_sms"
"Repository" = "https://github.com/Godwhitelight/uz801_sms"

[tool.setuptools]
packages = ["uz801_sms"]
